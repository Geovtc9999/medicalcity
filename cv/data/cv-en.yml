profil:
  titre: Profile
  texte: >
    Hands-on data solution architect. I design and land regulated end-to-end data chains: multi-source
    capture, normalisation, matching, automated controls, tamper-evident audit trail, on-demand retrieval.
    [[TO COMPLETE: X years of experience, of which Y in banking / capital markets — name your two
    strongest institutions here; this is the line the reader scans first]].
    I prototype myself, I document the lineage of what I deliver, and I hold the subject in front of
    IT as well as Operations, Risk and Compliance.

apport:
  titre: What I bring to this programme
  puces:
    - titre: End-to-end coherence, not a collection of connectors
      texte: >
        One canonical data model from the sources (Exchange/O365, Teams, Bloomberg IB & MSG, voice, mobile)
        through to the archiving systems, and an explicit interface contract per source: format, keys,
        timestamps, expected completeness, behaviour on late arrival and replay.
    - titre: Completeness that can be demonstrated at three levels
      texte: >
        Population reconciliation (HR / directory / entitlements against accounts actually journalled),
        volume reconciliation (counted at source vs ingested vs archived) and fidelity reconciliation
        (attachments, edits, deletions, threads, participants). Every gap is dated, attributed, explained.
    - titre: Controls that produce traceable exceptions
      texte: >
        Each control has an owner, a threshold, a frequency, an exception queue and an SLA.
        An exception is a data object with a lifecycle, not a chaser email.
    - titre: An audit trail that stands without trusting the operator
      texte: >
        Append-only hash-chained journal, immutable (WORM) storage, and an evidence pack that can be
        rebuilt cold: what was captured, through which path, when, under which version of which rule.
    - titre: Retrievability is measured, not promised
      texte: >
        The only test that counts is retrieving and exporting a defined scope of communications within the
        mandated window, blind, with elapsed time and completeness recorded. I put that test inside the PoC.
    - titre: A PoC designed to be promoted or thrown away
      texte: >
        Narrow scope — one population, two sources — but the same interface contracts, controls and exit
        criteria as the target, so the build decision is not taken on the strength of a demo.

competences:
  titre: Core skills
  groupes:
    - titre: Data architecture & integration
      items: >
        Target architecture and roadmap · interface contracts and data modelling
        · batch and near-real-time ingestion, CDC, event streaming · orchestration and scheduling
        · idempotency, replay, failure recovery, backfill · late-arriving data and event ordering
        · architecture documentation (C4, ADR)
        [[TO COMPLETE: keep only the technologies you genuinely master — Kafka, Spark, dbt, Airflow, Control-M, SQL, Python, Azure/AWS/GCP]]
    - titre: Matching & reconciliation
      items: >
        Deterministic and probabilistic matching · identity resolution
        (person ↔ accounts ↔ terminals ↔ supervised population) · key, tolerance and break-rule design
        · completeness and volume reconciliation · break management, requalification, ageing
        · control-on-the-control (reconciling the reconciliation)
    - titre: Data quality & control automation
      items: >
        Completeness, accuracy, uniqueness, timeliness and format-conformity dimensions
        · controls embedded in the pipeline rather than bolted on downstream · thresholds, scoring, trend
        · level-1 control automation and evidence production for level 2
        · control dashboards for Operations and Compliance
    - titre: Data lineage & governance
      items: >
        Technical and business lineage · traceability from regulatory requirement → rule → field → source
        · rule versioning and replayability of history · data dictionary and ownership
        · cataloguing and mapping [[TO COMPLETE: Collibra, Informatica, Solidatus, OpenMetadata, DataHub — keep only what you have used]]
    - titre: E-communications recordkeeping & archiving
      items: >
        Exchange / Exchange Online journalling · Teams (Graph export APIs, Purview, attachments held outside
        the message) · Bloomberg IB and MSG, entitlements, Vault · retention, legal hold, retention policies
        · WORM immutability (Object Lock, immutable blob) · indexing, search and e-discovery export
        · de-duplication while preserving proof of distribution
    - titre: Regulation translated into technical requirements
      items: >
        MiFID II art. 16(7) and Delegated Regulation (EU) 2017/565 art. 76 (5-year retention, 7 on request
        of the competent authority) · SEC 17a-4(f) and the audit-trail alternative introduced by the 2022
        amendments · FINRA 3110 / 4511, CFTC 1.31 and 1.35 · GDPR: minimisation, retention periods,
        employee rights, CNIL guidance · DORA: reliance on a third-party archive, testability, exit plan
    - titre: Delivery & stakeholders
      items: >
        PoC framing and design · build, test strategy, UAT, production cut-over
        · workshop facilitation and governance forums · IT / Operations / Risk / Compliance interface
        · trade-offs between regulatory requirement, feasibility and deadline · delivery in professional English

