huddle_8:
  - id: incidents_open
    label: "P0/P1 ouverts"
    fundamental: safety
    owner: ops
    red: "> 0 P0, or P1 age_hours > 72"
    ceo_action: "P0: casser l'OS. P1: allouer, ne pas investiguer soi-même."
  - id: hitl_sla
    label: "HITL hors SLA"
    fundamental: quality
    owner: age-comex
    red: "RECOMMENDED unanswered > 48h or any decision without WORM"
    ceo_action: "File 07:45. Silence = non."
  - id: platform_ci
    label: "CI / Bayon"
    fundamental: quality
    owner: plat
    red: "main red > 24h"
    ceo_action: "Demander cause + ETA, pas un debug."
  - id: runway_days
    label: "Runway (jours)"
    fundamental: stewardship
    owner: cfo
    red: "< 180 days without term-sheet"
    ceo_action: "Lundi: lire le chiffre à voix haute. < 180: Comex extra capital."
  - id: cd77_blocker
    label: "Blocker #1 CD77"
    fundamental: access
    owner: gtm
    red: "no named blocker or no dated next step"
    ceo_action: "Si toi es le blocker (signature, RDV), c'est priorité #1."
  - id: apa_hitl_queue
    label: "File APA humaine"
    fundamental: access
    owner: plat
    red: "queue > SLA or 0 real files with no plan at J90"
    ceo_action: "Trancher protocole, pas instruire le dossier."
  - id: fleet_sla
    label: "Dispo flotte"
    fundamental: safety
    owner: ops
    red: "below written SLA when live; N/A until go-live"
    ceo_action: "N/A en H0 sauf pré-prod. Dès live: P1 si sous SLA."
  - id: ceo_blocks_yesterday
    label: "Blocs Président hier"
    fundamental: stewardship
    owner: age-comex
    red: "protected block missed"
    ceo_action: "Replanifier cette semaine, pas 'rattraper le week-end'."

