    red: "prod system not listed"
  - id: unit_economics
    label: "LTV/CAC RaaS (COGS réels)"
    owner: cfo
    target: "> 5x documented"
    red: "< 3x or COGS unknown"
  - id: stopdoing_hours
    label: "Heures Président hors 12 sujets"
    owner: strat
    red: "> 2h / week"
  - id: rounding_done
    label: "Contact terrain"
    owner: ops
